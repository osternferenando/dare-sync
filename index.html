<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dare Sync</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <h1>Dare Sync</h1>
  <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
  <div class="status" id="status">Ready to play</div>
</header>

<!-- Connection Panel -->
<div class="panel" id="connectPanel">
  <div id="step1">
    <strong>Start a new game</strong>
    <button class="btn-primary" style="margin-top:15px;" onclick="createRoom()" id="createBtn">Create Room</button>
  </div>

  <div id="step2" style="display:none;">
    <strong>Share this Room Code:</strong>
    <div class="room-display" id="myCodeDisplay">---</div>
    <button class="btn-copy" onclick="copyCode()">📋 Copy Code</button>
    <p style="font-size:0.85rem; color:#64748b; margin-top:15px;">Waiting for friend to join...</p>
  </div>

  <div class="divider">— OR JOIN A GAME —</div>

  <div class="input-group">
    <input type="text" id="roomCodeInput" placeholder="CODE" maxlength="6" />
    <button class="btn-secondary" onclick="joinRoom()">Join</button>
  </div>
</div>

<!-- Game Area -->
<div class="game-area" id="gameArea">
  <div class="turn-indicator" id="turnIndicator">Your Turn</div>

  <div class="wheels-container">
    <div class="wheel-box">
      <div class="wheel-label">TYPE</div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel1" width="240" height="240"></canvas>
      </div>
    </div>
    <div class="wheel-box">
      <div class="wheel-label">PROMPT</div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel2" width="240" height="240"></canvas>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="spinBtn" onclick="handleSpin()">SPIN WHEELS</button>

  <div class="result-card" id="resultCard">
    <div class="result-label" id="resultType">TYPE</div>
    <div class="result-text" id="dareText">...</div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Customize Prompts</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('truths')">Truths</button>
      <button class="tab-btn" onclick="switchTab('dares')">Dares</button>
    </div>
    <div class="modal-body">
      <textarea id="truthsInput" placeholder="One truth per line..."></textarea>
      <textarea id="daresInput" placeholder="One dare per line..." style="display:none;"></textarea>
      <p class="hint">Changes sync to both players instantly.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn-primary" onclick="saveSettings()">Save & Sync</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="app.js"></script>

</body>
</html>
