<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dare Sync</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --error: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
  .status {
    font-size: 0.9rem;
    color: #64748b;
    margin-top: 8px;
    min-height: 20px;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.3s;
  }
  .status.connected { color: var(--success); background: #d1fae5; font-weight: 600; }
  .status.error { color: var(--error); background: #fee2e2; font-weight: 600; }
  .status.loading { color: var(--accent); background: #e0e7ff; }

  .panel {
    background: var(--card);
    padding: 24px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    text-align: center;
  }

  .input-group { display: flex; gap: 10px; margin-top: 15px; }
  input {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 2px;
    font-weight: 600;
  }
  input:focus { border-color: var(--accent); }

  button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f1f5f9; }
  .btn-copy { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); margin-top: 10px; width: 100%; }
  .btn-copy:hover { background: #e2e8f0; }

  .divider { margin: 20px 0; color: #94a3b8; font-size: 0.85rem; font-weight: 500; }

  .game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.3;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .game-area.active { opacity: 1; pointer-events: auto; }

  .wheel-container { position: relative; width: 300px; height: 300px; margin: 20px 0; }
  canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: var(--shadow); }
  .pointer {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 25px solid var(--accent); z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .result-card {
    background: var(--card);
    padding: 30px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    text-align: center;
    max-width: 400px;
    width: 100%;
    margin-top: 20px;
    border: 1px solid var(--border);
    transform: scale(0.95);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .result-card.show { transform: scale(1); opacity: 1; }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 10px; }
  .result-text { font-size: 1.3rem; font-weight: 700; color: var(--text); line-height: 1.4; }

  .turn-indicator {
    margin-bottom: 15px;
    padding: 10px 20px;
    background: #e0e7ff;
    color: var(--accent);
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 700;
    display: none;
  }
  .turn-indicator.visible { display: inline-block; }

  .room-display {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--accent);
    margin: 15px 0;
    padding: 15px;
    background: #f1f5f9;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
  }

  .error-box {
    background: #fee2e2;
    color: var(--error);
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 0.9rem;
    display: none;
  }
  .error-box.show { display: block; }
  .error-box button {
    margin-top: 10px;
    background: var(--error);
    color: white;
    width: 100%;
  }
</style>
</head>
<body>

<header>
  <h1>Dare Sync</h1>
  <div class="status" id="status">Ready to play</div>
</header>

<!-- Connection Panel -->
<div class="panel" id="connectPanel">
  <div id="step1">
    <strong>Start a new game</strong>
    <button class="btn-primary" style="margin-top:15px;" onclick="createRoom()" id="createBtn">Create Room</button>
  </div>

  <div id="step2" style="display:none;">
    <strong>Share this Room Code:</strong>
    <div class="room-display" id="myCodeDisplay">---</div>
    <button class="btn-copy" onclick="copyCode()">📋 Copy Code</button>
    <p style="font-size:0.85rem; color:#64748b; margin-top:15px;" id="waitingMsg">Waiting for friend to join...</p>
    <button class="btn-secondary" style="margin-top:10px; width:100%;" onclick="cancelRoom()">Cancel</button>
  </div>

  <div id="step3" style="display:none;">
    <strong>Join a game</strong>
    <div class="input-group">
      <input type="text" id="roomCodeInput" placeholder="CODE" maxlength="8" />
      <button class="btn-secondary" onclick="joinRoom()" id="joinBtn">Join</button>
    </div>
    <div class="error-box" id="joinError">
      <div id="joinErrorMsg">Connection failed</div>
      <button onclick="resetJoin()">Try Again</button>
    </div>
  </div>

  <div class="divider">— OR —</div>

  <button class="btn-secondary" style="width:100%;" onclick="showJoinStep()">Join Existing Game</button>
</div>

<!-- Game Area -->
<div class="game-area" id="gameArea">
  <div class="turn-indicator" id="turnIndicator">Your Turn</div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="400" height="400"></canvas>
  </div>

  <button class="btn-primary" id="spinBtn" style="padding: 15px 40px; font-size:1.1rem; max-width: 300px;" onclick="handleSpin()">SPIN WHEEL</button>

  <div class="result-card" id="resultCard">
    <div class="result-label" id="resultLabel">Your Dare</div>
    <div class="result-text" id="dareText">...</div>
  </div>
</div>

<script>
const DARES = [
  "Do 10 pushups right now",
  "Speak in an accent for the next 2 rounds",
  "Let the other player post a story on your phone",
  "Sing the chorus of your favorite song out loud",
  "Show the last photo in your camera roll",
  "Do your best robot dance for 15 seconds",
  "Tell a joke. If they don't laugh, do 5 burpees",
  "Hold an ice cube in your hand until it melts",
  "Let them style your hair however they want",
  "Talk without closing your mouth for 1 minute",
  "Do 15 jumping jacks",
  "Let the group give you a new nickname for the night"
];

let peer = null;
let conn = null;
let myId = null;
let isHost = false;
let isMyTurn = true;
let currentAngle = 0;
let spinning = false;
let connectionTimeout = null;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const colors = ['#6366f1', '#818cf8', '#a5b4fc', '#c7d2fe', '#e0e7ff'];

function drawWheel() {
  const size = canvas.width;
  const center = size / 2;
  const radius = center - 10;
  ctx.clearRect(0, 0, size, size);

  const slice = (Math.PI * 2) / DARES.length;

  DARES.forEach((dare, i) => {
    const start = currentAngle + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText(dare.length > 18 ? dare.substring(0,15)+"..." : dare, radius - 15, 5);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(center, center, 30, 0, Math.PI*2);
  ctx.fillStyle = "#fff";
  ctx.fill();
}

drawWheel();

// ============================================
// HELPERS
// ============================================

function generateRoomCode() {
  // 8-character code, more unique
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // removed confusing chars like 0/O, 1/I
  let code = '';
  for (let i = 0; i < 8; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function updateStatus(msg, type) {
  const el = document.getElementById('status');
  el.innerText = msg;
  el.className = 'status ' + (type || '');
}

function clearConnectionTimeout() {
  if (connectionTimeout) {
    clearTimeout(connectionTimeout);
    connectionTimeout = null;
  }
}

function cleanupPeer() {
  clearConnectionTimeout();
  if (conn) { try { conn.close(); } catch(e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
}

// ============================================
// CREATE ROOM (HOST)
// ============================================

function createRoom() {
  cleanupPeer();

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.innerText = "Connecting to server...";
  updateStatus("Connecting to signaling server...", "loading");

  const roomCode = generateRoomCode();
  myId = "daregame-" + roomCode + "-" + Date.now().toString(36);

  // Explicit PeerJS config for reliability
  peer = new Peer(myId, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    }
  });

  // Timeout: if peer doesn't open in 15 seconds, fail
  connectionTimeout = setTimeout(() => {
    if (!peer || peer.destroyed) return;
    updateStatus("Server connection timed out. Try again.", "error");
    btn.disabled = false;
    btn.innerText = "Create Room";
    cleanupPeer();
  }, 15000);

  peer.on('open', (id) => {
    clearConnectionTimeout();
    isHost = true;
    isMyTurn = true;

    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('myCodeDisplay').innerText = roomCode;
    updateStatus("Room ready! Share the code.", "connected");

    // Store roomCode for later
    peer._roomCode = roomCode;
  });

  peer.on('connection', (c) => {
    conn = c;
    setupHostConnection();
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    clearConnectionTimeout();
    btn.disabled = false;
    btn.innerText = "Create Room";

    let msg = "Connection error.";
    if (err.type === 'unavailable-id') msg = "Code taken. Try again.";
    else if (err.type === 'network') msg = "No internet connection.";
    else if (err.type === 'server-error') msg = "PeerJS server busy. Try again in a moment.";
    else if (err.type === 'socket-error') msg = "Socket error. Refresh and try again.";
    else if (err.type === 'socket-closed') msg = "Connection closed. Try again.";

    updateStatus(msg, "error");
    cleanupPeer();
  });
}

function setupHostConnection() {
  updateStatus("Player connecting...", "loading");
  document.getElementById('waitingMsg').innerText = "Player connecting...";

  // Timeout for connection opening
  connectionTimeout = setTimeout(() => {
    if (!conn || !conn.open) {
      updateStatus("Connection timed out. Player may have left.", "error");
      document.getElementById('waitingMsg').innerText = "Connection failed. Try again.";
    }
  }, 15000);

  conn.on('open', () => {
    clearConnectionTimeout();
    updateStatus("Connected! Game starting...", "connected");
    startGame();
    // Tell guest it's their turn first? No, host goes first.
    conn.send({ type: 'START', isMyTurn: false });
  });

  conn.on('data', (data) => handleData(data));

  conn.on('close', () => {
    updateStatus("Player disconnected", "error");
    document.getElementById('gameArea').classList.remove('active');
    document.getElementById('connectPanel').style.display = 'block';
    resetToStart();
  });

  conn.on('error', (err) => {
    console.error('Connection error:', err);
    updateStatus("Connection error: " + err.message, "error");
  });
}

// ============================================
// JOIN ROOM (GUEST)
// ============================================

function showJoinStep() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
  document.getElementById('roomCodeInput').focus();
}

function joinRoom() {
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (code.length < 6) {
    showJoinError("Please enter the full room code.");
    return;
  }

  cleanupPeer();

  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  btn.innerText = "...";
  updateStatus("Connecting to server...", "loading");

  // Find the host: we need to guess their full ID
  // Host ID format: daregame-{CODE}-{timestamp}
  // We'll use a list call to find matching peers
  // Actually, simpler: use a fixed prefix that both sides know

  // NEW APPROACH: Use a predictable host ID format
  const hostId = "daregame-" + code;

  peer = new Peer({
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    }
  });

  connectionTimeout = setTimeout(() => {
    if (!peer || peer.destroyed) return;
    showJoinError("Server connection timed out. Check your internet.");
    btn.disabled = false;
    btn.innerText = "Join";
    updateStatus("Connection timed out", "error");
    cleanupPeer();
  }, 15000);

  peer.on('open', () => {
    clearConnectionTimeout();
    updateStatus("Finding room...", "loading");

    // Connect to host
    conn = peer.connect(hostId, { reliable: true });

    // Timeout for connection
    connectionTimeout = setTimeout(() => {
      if (!conn || !conn.open) {
        showJoinError("Room not found or host left. Check the code.");
        btn.disabled = false;
        btn.innerText = "Join";
        updateStatus("Could not find room", "error");
        cleanupPeer();
      }
    }, 15000);

    conn.on('open', () => {
      clearConnectionTimeout();
      isHost = false;
      updateStatus("Connected!", "connected");
      startGame();
    });

    conn.on('data', (data) => handleData(data));

    conn.on('close', () => {
      updateStatus("Host disconnected", "error");
      document.getElementById('gameArea').classList.remove('active');
      document.getElementById('connectPanel').style.display = 'block';
      resetToStart();
    });

    conn.on('error', (err) => {
      console.error('Conn error:', err);
      showJoinError("Connection error: " + err.message);
      btn.disabled = false;
      btn.innerText = "Join";
    });
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    clearConnectionTimeout();
    btn.disabled = false;
    btn.innerText = "Join";

    let msg = "Connection error.";
    if (err.type === 'peer-unavailable') msg = "Room not found. Check the code.";
    else if (err.type === 'network') msg = "No internet connection.";
    else if (err.type === 'server-error') msg = "PeerJS server busy. Try again.";
    else if (err.type === 'socket-error') msg = "Socket error. Refresh page.";
    else msg = err.type + ": " + (err.message || "Unknown error");

    showJoinError(msg);
    updateStatus(msg, "error");
    cleanupPeer();
  });
}

function showJoinError(msg) {
  document.getElementById('joinErrorMsg').innerText = msg;
  document.getElementById('joinError').classList.add('show');
}

function resetJoin() {
  document.getElementById('joinError').classList.remove('show');
  document.getElementById('joinBtn').disabled = false;
  document.getElementById('joinBtn').innerText = "Join";
  updateStatus("Ready to join", "");
  cleanupPeer();
}

// ============================================
// GAME LOGIC
// ============================================

function startGame() {
  document.getElementById('connectPanel').style.display = 'none';
  document.getElementById('gameArea').classList.add('active');
  updateTurnIndicator();
}

function handleData(data) {
  if (data.type === 'START') {
    isMyTurn = data.isMyTurn;
    updateTurnIndicator();
  } else if (data.type === 'SPIN') {
    // Remote player spun - animate same wheel and show result
    remoteSpin(data.angle, data.dare);
  } else if (data.type === 'TURN') {
    isMyTurn = data.isMyTurn;
    updateTurnIndicator();
  }
}

function updateTurnIndicator() {
  const ind = document.getElementById('turnIndicator');
  const btn = document.getElementById('spinBtn');

  if (isMyTurn) {
    ind.innerText = "👉 YOUR TURN";
    ind.classList.add('visible');
    btn.disabled = false;
    btn.style.opacity = 1;
  } else {
    ind.innerText = "⏳ OPPONENT'S TURN";
    ind.classList.add('visible');
    btn.disabled = true;
    btn.style.opacity = 0.5;
  }
}

function handleSpin() {
  if (spinning || !isMyTurn) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultCard').classList.remove('show');

  const spinAmount = Math.PI * 2 * (5 + Math.random() * 5);
  const duration = 4000;
  const startTime = performance.now();
  const startAngle = currentAngle;

  // Calculate result now (deterministic based on spinAmount)
  const finalAngle = startAngle + spinAmount;
  const slice = (Math.PI * 2) / DARES.length;
  const normalized = ((Math.PI * 2 - (finalAngle % (Math.PI * 2))) + Math.PI * 1.5) % (Math.PI * 2);
  const index = Math.floor(normalized / slice) % DARES.length;
  const result = DARES[index];

  // Send to opponent IMMEDIATELY so they animate too
  if (conn && conn.open) {
    conn.send({ type: 'SPIN', angle: spinAmount, dare: result });
  }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    currentAngle = startAngle + spinAmount * ease;
    drawWheel();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // Show result
      document.getElementById('dareText').innerText = result;
      document.getElementById('resultCard').classList.add('show');

      // Switch turns
      isMyTurn = false;
      if (conn && conn.open) {
        conn.send({ type: 'TURN', isMyTurn: true });
      }
      updateTurnIndicator();
      spinning = false;
    }
  }
  requestAnimationFrame(animate);
}

function remoteSpin(spinAmount, dare) {
  spinning = true;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('spinBtn').disabled = true;

  const duration = 4000;
  const startTime = performance.now();
  const startAngle = currentAngle;

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    currentAngle = startAngle + spinAmount * ease;
    drawWheel();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      document.getElementById('dareText').innerText = dare;
      document.getElementById('resultCard').classList.add('show');

      // It's now my turn
      isMyTurn = true;
      updateTurnIndicator();
      spinning = false;
    }
  }
  requestAnimationFrame(animate);
}

// ============================================
// UI HELPERS
// ============================================

function cancelRoom() {
  cleanupPeer();
  resetToStart();
  updateStatus("Ready to play", "");
}

function resetToStart() {
  document.getElementById('step1').style.display = 'block';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';
  document.getElementById('createBtn').disabled = false;
  document.getElementById('createBtn').innerText = "Create Room";
  document.getElementById('waitingMsg').innerText = "Waiting for friend to join...";
}

function copyCode() {
  const code = document.getElementById('myCodeDisplay').innerText;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.btn-copy');
    const original = btn.innerText;
    btn.innerText = "✅ Copied!";
    setTimeout(() => btn.innerText = original, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert("Code copied: " + code);
  });
}
</script>
</body>
</html>
